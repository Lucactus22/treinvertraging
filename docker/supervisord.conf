; Everything logs to the container's stdout/stderr (docker logs).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:xvfb]
command=Xvfb :99 -screen 0 1366x768x24 -nolisten tcp
user=app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Waits for the X display, then serves it on 5900 (localhost only; reached through noVNC).
[program:x11vnc]
command=/bin/bash -c 'for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done; exec x11vnc -display :99 -forever -shared -rfbauth /data/vnc.pass -rfbport 5900 -localhost -noxdamage -quiet'
user=app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
user=app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=treinvertraging serve --host 0.0.0.0 --port 8080
directory=/app
user=app
priority=40
autorestart=true
startsecs=5
environment=HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
